<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Simplified — Practice Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="nav">
      <a href="#home" aria-label="Frontend Simplified home">
        <img class="logo" src="assets/FES.svg" alt="Frontend Simplified" />
      </a>

      <ul class="nav__links">
        <li><a href="#about">About</a></li>
        <li><a href="#discord">Discord</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <header id="home" class="hero">
      <div class="row hero__content">
        <div class="hero__text">
          <h1>Build your first website.</h1>
          <p>
            Practice HTML and CSS, learn how layouts work, and turn your ideas
            into something you can see.
          </p>
          <a class="button" href="#about">Get started</a>
        </div>

        <figure class="hero__image">
          <img src="assets/laptop.png" alt="Laptop illustration" />
        </figure>
      </div>
    </header>

    <main>
      <section id="about" class="section section--blue">
        <div class="row">
          <h2>About</h2>

          <div class="section__content">
            <div class="section__text">
              <p>Every</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
